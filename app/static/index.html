<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Picky Eater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav id="navbar">
  <div class="nav-logo" onclick="goHome()" title="Home">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="15" fill="#2563EB"/>
      <path d="M10 9v4a3 3 0 0 0 2 2.83V21h2v-5.17A3 3 0 0 0 16 13V9h-2v3.5a1 1 0 0 1-2 0V9h-2zm8 0h2v12h-2V9z" fill="white"/>
    </svg>
    <span class="logo-text">Picky Eater</span>
  </div>
  <div class="nav-search">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="q" placeholder="Search recipes, ingredients, or cuisines…">
    </div>
    <button class="btn-primary" onclick="search()">Search</button>
  </div>
  <div class="nav-actions"></div>
</nav>

<div id="app-body">
  <main id="main">
    <div id="list-view">
      <div class="list-header">
        <div>
          <h1 id="list-title">Discover Recipes</h1>
          <p id="list-subtitle" class="list-sub">Based on your available ingredients</p>
        </div>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <aside id="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-section-label">User Account</div>
      <div class="user-status-row">
        <span class="status-dot active" id="status-dot"></span>
        <span id="status-label" class="status-label">Connected</span>
      </div>
      <div class="user-id-row">
        <span class="uid-prefix">UID:</span>
        <b id="uid">—</b>
        <button class="icon-btn" onclick="randomUser()" title="Random training user">🔀</button>
        <button class="icon-btn" onclick="coldStartUser()" title="New cold-start user (no history)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="editUser()" title="Edit ID">✏️</button>
      </div>
      <div id="user-type-badge"></div>
    </div>

    <div class="sidebar-card">
      <div class="sidebar-section-label">Reviewed Recipes</div>
      <div id="reviews"><span class="msg">—</span></div>
    </div>

    <div class="sidebar-card">
      <div class="sidebar-section-label">Dietary Filters</div>
      <div class="pills-wrap" id="diet-pills"><span class="msg">Loading…</span></div>
    </div>

    <div class="sidebar-card" id="fridge-card">
      <div class="sidebar-section-label">My Fridge</div>
      <div id="fridge" class="pills-wrap fridge-pills"></div>
      <button class="fridge-toggle" id="fridge-toggle" style="display:none" onclick="toggleFridge()">Show all</button>
      <div id="fridge-row">
        <input id="fi" placeholder="Add ingredient…">
        <button class="fridge-add-btn" onclick="addFridge()">+</button>
      </div>
    </div>
  </aside>
</div>

<div id="modal-overlay" onclick="overlayClick(event)">
  <div id="modal" role="dialog" aria-modal="true">

    <div class="modal-header-img" id="m-img">
      <div class="modal-img-placeholder">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
      </div>
    </div>

    <div class="modal-body">
      <div class="modal-left">
        <div class="modal-meta-top">
          <span class="modal-tag" id="m-tag">Loading…</span>
        </div>
        <div class="modal-rating-row" id="m-rating-row"></div>
        <h2 class="modal-title" id="m-name">Loading…</h2>
        <div class="modal-stats-row" id="m-stats"></div>
        <div class="modal-divider"></div>
        <div class="modal-section-label">Ingredients <span id="m-ing-count" class="modal-count"></span></div>
        <div id="m-ings" class="modal-ings-list"></div>
        <button class="add-fridge-btn" id="m-add-fridge" onclick="addMissingToFridge()" style="display:none"
          title="Adds unchecked ingredients (ones you don't have) to your Fridge sidebar so future recommendations account for them">
          + Add missing to Fridge
        </button>
        <div class="modal-section-label gap-top">Description</div>
        <p id="m-desc" class="modal-desc"></p>
      </div>

      <div class="modal-right">
        <div class="modal-section-label">
          Preparation Steps
          <svg class="steps-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/>
          </svg>
        </div>
        <ol id="m-steps" class="modal-steps"></ol>

        <div id="m-why-section" style="display:none">
          <div class="modal-divider gap"></div>
          <div class="modal-section-label">Why this?</div>
          <div id="m-why" class="modal-why"></div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="modal-footer-left">
        <span class="modal-section-label" style="align-self:center">Rate:</span>
        <div id="m-stars"></div>
      </div>
      <div class="modal-footer-right">
        <button class="modal-reset-btn" onclick="resetRating()">↺ Reset</button>
        <button class="modal-close-btn" onclick="closeRecipe()">Close Recipe</button>
      </div>
    </div>

    <button class="modal-x" onclick="closeRecipe()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
